name: CineHunt SonarQube Cloud
# Verified full SHAs: prevent floating-tag supply-chain drift.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-coverage:
    name: Backend LCOV
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install Backend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run existing Node tests with native LCOV reporter
        run: |
          mkdir -p coverage
          TS_NODE_PROJECT=test/tsconfig.json node --enable-source-maps \
            --test --require ts-node/register --experimental-test-coverage \
            --test-reporter=spec --test-reporter=lcov \
            --test-reporter-destination=stdout \
            --test-reporter-destination=coverage/lcov.info \
            test/*.test.ts
      - name: Verify production source coverage and normalize paths
        run: cd .. && python3 scripts/normalize-sonar-lcov.py backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cinehunt-backend-lcov
          path: backend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  web-coverage:
    name: Admin Web LCOV
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Install Web dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Vitest V8 coverage
        run: npm run test:coverage -- --coverage.include='src/**/*.{ts,tsx}' --coverage.reporter=lcov --coverage.reporter=text-summary
      - name: Verify production source coverage and normalize paths
        run: cd .. && python3 scripts/normalize-sonar-lcov.py admin-web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cinehunt-web-lcov
          path: admin-web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  ai-coverage:
    name: AI Python Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements-ci.lock
      - name: Install AI dependencies and coverage from hash-locked wheel files
        env:
          PIP_ONLY_BINARY: ':all:'
        run: |
          python -m pip install --require-hashes -r ai/requirements-ci.lock
          python -m pip check
      - name: Run existing AI smoke tests with coverage
        run: |
          python -m coverage run --source=ai ai/smoke_test.py
          python -m coverage xml -o ai/coverage.xml
      - name: Verify XML maps to actual AI source
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          report = Path("ai/coverage.xml")
          root = ET.parse(report).getroot()
          sources = [x.get("filename", "") for x in root.iter("class")]
          assert any(s.startswith("ai/app/") and Path(s).is_file() for s in sources), sources
          print("Validated AI coverage XML:", [s for s in sources if s.startswith("ai/app/")])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cinehunt-ai-coverage
          path: ai/coverage.xml
          if-no-files-found: error
          retention-days: 14

  mobile-coverage:
    name: Mobile Tests + LCOV
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install Mobile dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check Mobile including Jest test files
        working-directory: mobile
        run: npm run typecheck
      - name: Lint Mobile
        working-directory: mobile
        run: npm run lint
      - name: Run existing Node.js regression tests
        working-directory: mobile
        run: npm run test:node
      - name: Run Expo Jest component tests and generate LCOV
        working-directory: mobile
        run: npm run test:coverage
      - name: Verify real Mobile source coverage and normalize paths
        run: python3 scripts/normalize-sonar-lcov.py mobile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cinehunt-mobile-lcov
          path: mobile/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  sonarqube:
    name: SonarQube Analysis + Quality Gate
    needs: [backend-coverage, web-coverage, ai-coverage, mobile-coverage]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cinehunt-backend-lcov
          path: backend/coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cinehunt-web-lcov
          path: admin-web/coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cinehunt-ai-coverage
          path: ai
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cinehunt-mobile-lcov
          path: mobile/coverage
      - name: Verify coverage reports exist
        run: |
          test -s backend/coverage/lcov.info
          test -s admin-web/coverage/lcov.info
          test -s ai/coverage.xml
          test -s mobile/coverage/lcov.info
      # Sonar TypeScript analyzer resolves Expo, Nest and Vite inherited
      # tsconfig files from node_modules. Coverage artifacts alone do not
      # contain those dependencies.
      - name: Set up Node.js 22 for Backend and Mobile analysis
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Restore Backend TypeScript dependencies for analysis
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore Mobile Expo tsconfig dependencies for analysis
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Set up Node.js 24 for Admin Web analysis
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Restore Admin Web TypeScript dependencies for analysis
        working-directory: admin-web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Authenticate to SonarQube Cloud with OIDC
        id: auth
        uses: SonarSource/sonarqube-auth-action@a0aa643acde4162396015b4f12536c1b9c4aab82
        with:
          project-key: Minhhanh-zit_Ung_Dung_Dat_Ve_Xem_Phim
      - name: Scan sources, import coverage, and wait for Quality Gate
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4
        with:
          args: >
            -Dsonar.organization=${{ steps.auth.outputs.organization }}
            -Dsonar.projectKey=${{ steps.auth.outputs.project-key }}

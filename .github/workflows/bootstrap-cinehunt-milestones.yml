name: Bootstrap CineHunt Milestones

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-cinehunt-milestones.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-milestones:
    runs-on: ubuntu-latest
    steps:
      - name: Create 10 milestones and link 48 existing issues
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
            import json, os, re, sys, urllib.request, urllib.error
            token=os.environ['GH_TOKEN']
            repo=os.environ['GITHUB_REPOSITORY']
            base='https://api.github.com/repos/'+repo
            headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28','User-Agent':'CineHunt-Milestones-Bootstrap'}
            def api(method, path, payload=None):
                raw=None if payload is None else json.dumps(payload,ensure_ascii=False).encode('utf-8')
                req=urllib.request.Request(base+path,data=raw,headers=headers,method=method)
                try:
                    with urllib.request.urlopen(req,timeout=30) as res: return json.load(res)
                except urllib.error.HTTPError as exc:
                    err=exc.read().decode('utf-8','replace')
                    raise RuntimeError('%s %s failed: %s %s' % (method,path,exc.code,err[:900])) from exc
            milestones=json.loads("[{\"code\":\"M01\",\"title\":\"Khởi tạo dự án và phân tích yêu cầu\",\"nums\":[1,2,3,4],\"goal\":\"Thiết lập môi trường, chạy dịch vụ sẵn có, phân tích Use Case và phân quyền, chốt kiến trúc mobile/web/backend/AI.\",\"accept\":\"Môi trường chạy được; tài liệu yêu cầu, phân quyền và kiến trúc được trưởng nhóm duyệt.\"},{\"code\":\"M02\",\"title\":\"Backend, SQL Server và phân quyền nền tảng\",\"nums\":[5,6,7,8,9],\"goal\":\"Chuẩn hóa API, kiểm thử dữ liệu nhiều chi nhánh, thêm Manager/Staff theo rạp, nghiệp vụ quầy và API vị trí.\",\"accept\":\"API tích hợp được, SQL Server nhất quán, quyền theo chi nhánh được kiểm tra tại backend.\"},{\"code\":\"M03\",\"title\":\"Mobile khách hàng: tài khoản và khám phá phim\",\"nums\":[10,11,12,18],\"goal\":\"Dựng ứng dụng Expo, đăng nhập/refresh token/hồ sơ, danh sách phim, tìm kiếm, chi tiết, trailer và cá nhân hóa.\",\"accept\":\"Khách đăng nhập và xem/tìm phim từ API thật trên điện thoại.\"},{\"code\":\"M04\",\"title\":\"Chi nhánh, suất chiếu và sơ đồ ghế đồng bộ\",\"nums\":[13,14,44],\"goal\":\"Cho khách chọn rạp, phòng và suất; hiển thị trạng thái và giá ghế theo showtime; đồng bộ các client bằng polling hoặc WebSocket.\",\"accept\":\"Sơ đồ đúng suất chiếu, cập nhật ghế thay đổi và không cho chọn ghế SOLD/BLOCKED.\"},{\"code\":\"M05\",\"title\":\"Giữ ghế và kiểm thử chống trùng\",\"nums\":[15,35],\"goal\":\"Hoàn thiện giữ nhiều ghế, đếm ngược, xử lý hết hạn/xung đột và kiểm thử API đồng thời.\",\"accept\":\"Hai khách giữ cùng ghế trong cùng suất chiếu chỉ một yêu cầu thành công; dữ liệu SQL không trùng.\"},{\"code\":\"M06\",\"title\":\"Đặt vé, thanh toán, QR và hoàn tiền\",\"nums\":[16,17,43],\"goal\":\"Hoàn thành checkout, combo, voucher, MOCK/CASH/BANKING theo quyền, vé QR, lịch sử và hủy/hoàn tiền.\",\"accept\":\"Đặt vé hợp lệ end-to-end, cấp QR đúng điều kiện, trạng thái đơn và tiền được đối chiếu.\"},{\"code\":\"M07\",\"title\":\"Mobile nhân viên và bán vé tại quầy\",\"nums\":[19,20,21],\"goal\":\"Xây dựng tra cứu/check-in QR, bán vé quầy, xác nhận thanh toán và giới hạn quyền theo chi nhánh.\",\"accept\":\"Staff bán/check-in vé hợp lệ, không bán trùng với mobile và không truy cập rạp khác.\"},{\"code\":\"M08\",\"title\":\"Web Admin và quản lý nhiều chi nhánh\",\"nums\":[22,23,24,25,26,27,28,29,45,46,47],\"goal\":\"Tạo web React TypeScript mới; quản lý phim, phòng/ghế, lịch chiếu, nhân viên, giao dịch, sự cố, báo cáo, thông báo và audit log.\",\"accept\":\"Admin quản lý toàn hệ thống; Manager chỉ thao tác trong chi nhánh được gán; API có kiểm tra quyền.\"},{\"code\":\"M09\",\"title\":\"AI, GPS, bản đồ và tư vấn đặt vé\",\"nums\":[30,31,32,33,34],\"goal\":\"Tích hợp chatbot/recommender hiện có, xin quyền GPS, tìm rạp gần nhất, bản đồ, tư vấn suất/giá/ghế và hỗ trợ đặt vé có xác nhận.\",\"accept\":\"AI dùng dữ liệu thật, không tự ý giữ ghế/tạo đơn/thanh toán; tìm được rạp hoặc có phương án nhập thủ công.\"},{\"code\":\"M10\",\"title\":\"Kiểm thử tích hợp, tài liệu và bàn giao\",\"nums\":[36,37,38,39,40,41,42,48],\"goal\":\"Kiểm thử xung đột đa kênh, giao dịch lặp, hết hạn, quyền truy cập, lỗi mạng, thiết bị thật; viết README, báo cáo và quay video demo.\",\"accept\":\"Có log/test case PASS/FAIL, bằng chứng demo trên thiết bị thật, tài liệu chạy và báo cáo đối chiếu chức năng.\"}]")
            issues=api('GET','/issues?state=all&per_page=100')
            bycv={}
            for item in issues:
                if 'pull_request' in item: continue
                found=re.search(r'\bCV(\d{2})\b',item['title'])
                if found: bycv[int(found.group(1))]=item
            expected={n for m in milestones for n in m['nums']}
            missing=sorted(expected-set(bycv))
            if missing: raise RuntimeError('Missing CV issues: '+str(missing))
            existing=api('GET','/milestones?state=all&per_page=100')
            bycode={}
            for m in existing:
                found=re.match(r'^\s*(M\d{2})\b',m['title'])
                if found: bycode[found.group(1)]=m
            print('Found %d/48 issues and %d existing milestones.' % (len(bycv),len(existing)))
            for m in milestones:
                code=m['code']
                rows=['- '+('#%s'%bycv[n]['number'])+' | '+bycv[n]['title'] for n in m['nums']]
                description='**Mục tiêu:** '+m['goal']+'\n\n**Công việc / Issues:**\n'+'\n'.join(rows)+'\n\n**Tiêu chí nghiệm thu:** '+m['accept']+'\n\n**Quy ước:** Chỉ phát triển trong repository mới; không thay đổi CineHunt gốc. Các Issue ghi người phụ trách, P0/P1 và đầu việc chi tiết.'
                if code in bycode:
                    milestone=bycode[code]
                    print('KEEP %s (#%s) - milestone already exists' % (code,milestone['number']))
                else:
                    milestone=api('POST','/milestones',{'title':code+' - '+m['title'],'description':description,'state':'open'})
                    print('CREATED %s (#%s)' % (code,milestone['number']))
                for n in m['nums']:
                    issue=bycv[n]
                    old=issue.get('milestone') or {}
                    if old.get('number')==milestone['number']:
                        print('  SKIP CV%02d already attached' % n)
                        continue
                    api('PATCH','/issues/'+str(issue['number']),{'milestone':milestone['number']})
                    print('  LINK CV%02d -> %s' % (n,code))
            print('All milestones and issue links processed.')
          PY

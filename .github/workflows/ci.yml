name: CI - CineHunt Full Stack
# Actions pinned to verified full commit SHAs to prevent mutable-tag drift.

# PR and main push: run checks; CD may invoke the same checks before publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinehunt-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-security:
    name: Static security and syntax (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check modified scripts without executing E2E or SQL
        run: |
          bash -n scripts/cinehunt-test-auto.sh
          for script in deploy/scripts/*.sh; do bash -n "$script"; done
          IMAGE_TAG=0000000000000000000000000000000000000000 \
            docker compose --env-file deploy/.env.staging.example \
            -f deploy/compose.staging.yaml config --quiet
          node --check backend/scripts/start-stack.cjs
          node --check backend/test/e2e-critical-lifecycle.mjs
      - name: Reject bcrypt hashes committed in legacy SQL reference
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path("database/reference/CineHunt_Database_V6_3_With_Sample_Data.sql").read_text()
          if re.search(r'\$2[aby]\$\d{2}\$[./A-Za-z0-9]{53}', source):
              raise SystemExit("BLOCKED: hardcoded bcrypt hash found in legacy SQL reference.")
          print("PASS: No embedded bcrypt password hash in legacy SQL reference.")
          PY

  backend:
    name: Backend NestJS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  admin-web:
    name: Admin Web React/Vite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile Expo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint:active
      - run: npm test

  ai:
    name: AI recommendation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements-ci.lock
      - name: Install AI Python packages using SHA-256 hashes
        env:
          PIP_ONLY_BINARY: ':all:'
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip check
      - run: python -m compileall -q app
      - run: python smoke_test.py

# SQL integration tests are intentionally excluded from default CI:
# they require an isolated SQL Server initialized with the project's schema.
# Never run migrations against a shared developer or production database.

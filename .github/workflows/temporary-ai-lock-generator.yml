# Temporary CI-only helper for producing a hashed Python dependency lock.
# Remove after the lock file is committed and validated.
name: Temporary AI hashed lock generator

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  compile-lock:
    if: github.head_ref == 'ci/sonarqube-coverage-quality-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile exact dependencies with SHA-256 hashes
        run: |
          python -m pip install --only-binary=:all: 'pip-tools==7.6.2'
          printf '%s\n' '-r requirements.txt' 'coverage==7.13.3' > ai/requirements-ci.in
          pip-compile --generate-hashes --no-header --no-annotate --output-file ai/requirements-ci.lock ai/requirements-ci.in
          python - <<'PY'
          from pathlib import Path
          import base64
          lock = Path('ai/requirements-ci.lock').read_bytes()
          print('CINEHUNT_LOCKFILE_BEGIN')
          print(base64.b64encode(lock).decode('ascii'))
          print('CINEHUNT_LOCKFILE_END')
          print(f'Lock bytes: {len(lock)}')
          PY

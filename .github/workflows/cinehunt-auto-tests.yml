name: CineHunt Auto Test
# Actions pinned to verified full commit SHAs to prevent mutable-tag drift.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm, cache-dependency-path: backend/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: ./node_modules/.bin/tsc --noEmit --incremental false
      - run: npm test
      - run: npm run lint
      - run: npm run build
  mobile:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm, cache-dependency-path: mobile/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint:active
      - run: npm test
  admin-web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: admin-web}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm, cache-dependency-path: admin-web/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: ./node_modules/.bin/playwright test --config playwright.smoke.config.ts
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cinehunt-playwright-report
          path: admin-web/playwright-report-smoke/
          if-no-files-found: ignore

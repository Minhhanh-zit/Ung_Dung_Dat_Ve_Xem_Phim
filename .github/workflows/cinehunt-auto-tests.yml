name: CineHunt Auto Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: backend/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: ./node_modules/.bin/tsc --noEmit --incremental false
      - run: npm test
      - run: npm run lint
      - run: npm run build
  mobile:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: mobile/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint:active
      - run: npm test
  admin-web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: admin-web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: admin-web/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.smoke.config.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cinehunt-playwright-report
          path: admin-web/playwright-report-smoke/
          if-no-files-found: ignore

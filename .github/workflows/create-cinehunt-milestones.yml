name: Create CineHunt milestones and link 48 issues
on:
  push:
    paths:
      - '.github/workflows/create-cinehunt-milestones.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  setup-milestones:
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse milestones and link issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, json, re, urllib.request, urllib.error
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def request(method, path, payload=None):
              data = json.dumps(payload, ensure_ascii=False).encode('utf-8') if payload is not None else None
              req = urllib.request.Request(api + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as res:
                      return json.loads(res.read().decode('utf-8'))
              except urllib.error.HTTPError as ex:
                  raise RuntimeError(f'{method} {path}: {ex.code} {ex.read().decode()}')
          definitions = [["M01","Khởi tạo và phân tích yêu cầu","CV01–CV04. Khảo sát và sao chép nền tảng CineHunt sang dự án riêng; chạy NestJS/SQL Server/Swagger/AI; phân tích Use Case, phân quyền và kiến trúc tích hợp.","Có môi trường khởi chạy, yêu cầu nghiệp vụ, phân quyền và kiến trúc được nhóm xác nhận."],["M02","Backend, SQL Server và phân quyền","CV05–CV09. Rà soát API và transaction đặt vé; dữ liệu nhiều chi nhánh; bổ sung Cinema Manager và phân quyền theo rạp; bán vé tại quầy và ghế bảo trì; lọc rạp theo vị trí.","Backend kiểm tra được dữ liệu/phân quyền theo chi nhánh; nghiệp vụ quầy dùng chung cơ chế chống trùng ghế."],["M03","Mobile khách hàng: tài khoản và phim","CV10–CV12, CV18. Dựng React Native/Expo, đăng ký/đăng nhập/refresh token, hồ sơ, trang chủ, tìm kiếm, chi tiết phim, trailer, yêu thích và đánh giá.","Khách đăng nhập và khám phá phim từ API thật trên điện thoại."],["M04","Chi nhánh, suất chiếu và sơ đồ ghế","CV13, CV14, CV44. Chọn rạp/phòng/suất chiếu; hiển thị sơ đồ, loại, giá, trạng thái AVAILABLE/HELD/SOLD/BLOCKED; đồng bộ bằng polling hoặc WebSocket.","Sơ đồ ghế đúng suất chiếu, cập nhật dữ liệu ghế đồng bộ, không lựa chọn ghế không hợp lệ."],["M05","Giữ ghế và chống trùng đặt vé","CV15, CV35. Giữ nhiều ghế, đếm ngược hết hạn, release an toàn, dùng transaction/khóa SQL; chạy bài kiểm thử đồng thời hai khách giữ cùng ghế.","Hai khách cùng giữ một ghế trong cùng suất chỉ một người thành công; lỗi không giữ một phần."],["M06","Đặt vé, thanh toán, QR và hoàn tiền","CV16, CV17, CV43. Tạo booking, combo, voucher, thanh toán demo/phương thức được hỗ trợ, vé QR, lịch sử và quy trình hủy/yêu cầu hoàn tiền.","Đặt vé hoàn chỉnh, phát hành vé hợp lệ đúng một lần, có lịch sử và quản lý hủy/hoàn."],["M07","Nhân viên rạp và nghiệp vụ tại quầy","CV19–CV21. Mobile Staff tra cứu, quét QR, check-in, bán vé trực tiếp; xác nhận thanh toán theo quyền và giới hạn đúng chi nhánh.","Quầy không bán trùng với Online; check-in đúng điều kiện; không truy cập chi nhánh khác."],["M08","Web Admin và quản lý nhiều chi nhánh","CV22–CV29, CV45–CV47. Dựng web React/TypeScript; quản lý phim, phòng, ghế, lịch chiếu, nhân sự, tài khoản, đơn, combo, voucher, doanh thu, thông báo và sự cố.","Admin quản lý hệ thống; Manager giới hạn chi nhánh; có kiểm tra trùng lịch và báo cáo."],["M09","Trợ lý AI, GPS và bản đồ","CV30–CV34. Tích hợp chatbot và gợi ý phim, lấy GPS có đồng ý, tìm rạp gần nhất, bản đồ, đề xuất suất theo thời gian/ngân sách và hỗ trợ đặt vé có xác nhận.","AI dùng dữ liệu thật, không tự ý giữ ghế/tạo đơn/thanh toán; chọn được rạp gần nhất."],["M10","Kiểm thử, tài liệu và bàn giao","CV36–CV42, CV48. Kiểm thử xung đột ghế các kênh, giữ/hết hạn/thanh toán lặp, RBAC, điện thoại thật; viết README, test case, báo cáo, ảnh/video demo.","Các test chính có log/bằng chứng; ứng dụng demo được trên thiết bị thật; đủ tài liệu."]]
          milestones = {}
          for page in range(1, 5):
              batch = request('GET', f'/milestones?state=all&per_page=100&page={page}')
              for m in batch:
                  mat = re.match(r'^(M\d\d)\b', m['title'])
                  if mat: milestones[mat.group(1)] = m
              if len(batch) < 100: break
          for code, title, description, criteria in definitions:
              if code not in milestones:
                  m = request('POST', '/milestones', {'title': code + ' - ' + title, 'description': 'PHẠM VI: ' + description + '\n\nNGHIỆM THU: ' + criteria, 'state': 'open'})
                  milestones[code] = m
                  print('CREATED', code, m['number'])
              else:
                  print('EXISTS', code, milestones[code]['number'])
          issues = []
          for page in range(1, 5):
              batch = request('GET', f'/issues?state=all&per_page=100&page={page}')
              issues.extend(x for x in batch if 'pull_request' not in x)
              if len(batch) < 100: break
          found, updated = set(), 0
          for issue in issues:
              mat = re.match(r'^\[(M\d\d)\]\s*(CV\d\d)\b', issue['title'])
              if not mat: continue
              code, cv = mat.groups()
              if code not in milestones: raise RuntimeError('Unknown milestone ' + code + ' in ' + cv)
              found.add(cv)
              number = milestones[code]['number']
              if (issue.get('milestone') or {}).get('number') != number:
                  request('PATCH', f"/issues/{issue['number']}", {'milestone': number})
                  updated += 1
                  print('ASSIGNED', cv, '->', code)
          expected = {'CV'+str(i).zfill(2) for i in range(1,49)}
          if found != expected: raise RuntimeError('Missing CV: ' + str(sorted(expected-found)))
          print('SUCCESS: 10 milestones,', len(found), 'issues found,', updated, 'issues assigned or updated')
          
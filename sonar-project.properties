# CineHunt | SonarQube Cloud (GitHub Actions / OIDC)
# Project and organization keys are passed by sonarqube-auth-action.
sonar.projectName=CineHunt
sonar.sourceEncoding=UTF-8

# Analyze the entire repository, including workflow and SQL security.
# Distinguish production from test code explicitly without excluding source.
# Test inclusion patterns are also automatically excluded from source scope.
sonar.sources=.
sonar.tests=ai,backend/test,admin-web/test,mobile/tests
sonar.test.inclusions=ai/smoke_test.py,backend/test/**,admin-web/test/**,mobile/tests/**

# CineHunt is Microsoft SQL Server (T-SQL), not Oracle PL/SQL.
# Avoid misclassifying .sql stored procedures as Oracle SQL.
sonar.tsql.file.suffixes=sql,tsql
sonar.plsql.file.suffixes=pks,pkb
sonar.coverage.exclusions=**/test/**,**/tests/**,**/*.test.*,**/*.spec.*,scripts/**,backend/scripts/**,mobile/scripts/**,ai/scripts/**,ai/smoke_test.py,ai/train.py,database/**,docs/**,.github/**,**/Dockerfile

# Generated files and dependency trees are not source
# Do not feed binary images, documents or fonts to source-code parsers.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.expo/**,**/*.min.js,**/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.gif,**/*.ico,**/*.pdf,**/*.docx,**/*.xlsx,**/*.pptx,**/*.woff,**/*.woff2,**/*.ttf,**/*.otf,**/coverage.xml

# Actual test-runner output; no fabricated coverage values
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,admin-web/coverage/lcov.info
sonar.python.coverage.reportPaths=ai/coverage.xml

# Wait for the project's configured SonarQube Cloud Quality Gate.
# Fails this GitHub Actions job if the gate fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Match the Python runtime used by AI and CI.
sonar.python.version=3.12

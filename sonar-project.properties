# CineHunt | SonarQube Cloud (GitHub Actions / OIDC)
# Project and organization keys are passed by sonarqube-auth-action.
sonar.projectName=CineHunt
sonar.sourceEncoding=UTF-8

# Analyze the four application components only.
sonar.sources=backend/src,admin-web/src,mobile/src,ai/app
sonar.tests=backend/test,admin-web/test,mobile/tests

# Generated files and dependencies should not affect analysis.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.expo/**,**/*.min.js

# Coverage reports can be added after the first successful CI-based scan.
